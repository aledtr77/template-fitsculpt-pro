<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FitSculpt Pro</title>
  <meta name="description" content="Have questions about our fitness coaching or digital templates? Get in touch with our team today.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff3b5c'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>">
</head>
<body>

  <!-- Header -->
  <header class="site-header scrolled">
    <div class="container header-container">
      <a href="../index.html" class="brand-logo">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        <span>FIT<span class="text-gradient">SCULPT</span></span>
      </a>

      <nav class="nav-menu" id="navMenu">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="programs.html" class="nav-link">Programs</a>
        <a href="contact.html" class="nav-link active">Contact</a>
      </nav>

      <div class="header-actions">
        <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle Theme">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <a href="../index.html" class="btn btn-primary">Back To Home</a>
      </div>
    </div>
  </header>

  <main style="padding-top: calc(var(--header-height) + 3rem);">
    <section class="section">
      <div class="container" style="max-width: 700px;">
        <div class="text-center" style="margin-bottom: 3rem;">
          <div class="section-tag">Get In Touch</div>
          <h1>Let's Talk <span class="text-gradient">Fitness</span></h1>
          <p style="color: var(--text-secondary); margin-top: 0.5rem;">
            Send us a message and Coach Elena's team will respond within 24 hours.
          </p>
        </div>

        <div class="glass-card">
          <form id="pageContactForm">
            <div class="form-group">
              <label class="form-label" for="contactName">Your Name</label>
              <input type="text" id="contactName" class="form-input" placeholder="e.g. Jessica Alba" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactEmail">Email Address</label>
              <input type="email" id="contactEmail" class="form-input" placeholder="e.g. jessica@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactSubject">Subject</label>
              <input type="text" id="contactSubject" class="form-input" placeholder="Coaching Inquiry / Template Customization" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactMessage">Message</label>
              <textarea id="contactMessage" class="form-textarea" rows="5" placeholder="Tell us about your fitness goals or questions..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 FitSculpt Pro Template. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="../src/scripts/main.js"></script>
</body>
</html>
