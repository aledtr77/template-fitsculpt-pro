<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FitSculpt Pro</title>
  <meta name="description" content="Have questions about our fitness coaching or digital templates? Get in touch with our team today.">
  <meta name="theme-color" content="#0e1219">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="../src/styles/main.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">

  <script>
    // Applied before first paint so a stored light theme does not flash dark.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>
<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <div class="nav-backdrop" id="navBackdrop"></div>

  <!-- Header -->
  <header class="site-header scrolled">
    <div class="container header-container">
      <a href="../index.html" class="brand-logo">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 5v14M18 5v14M3 8v8M21 8v8M9 12h6"/>
        </svg>
        <span>FIT<span class="text-gradient">SCULPT</span></span>
      </a>

      <nav class="nav-menu" id="navMenu" aria-label="Main">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="programs.html" class="nav-link">Programs</a>
        <a href="contact.html" class="nav-link active" aria-current="page">Contact</a>
      </nav>

      <div class="header-actions">
        <button type="button" class="theme-toggle" id="themeToggleBtn" aria-label="Switch theme">
          <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <a href="../index.html" class="btn btn-primary">Back To Home</a>
        <button type="button" class="mobile-toggle" id="mobileToggle" aria-label="Menu" aria-expanded="false" aria-controls="navMenu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="page-main">
    <section class="section">
      <div class="container container-narrow">
        <div class="text-center">
          <p class="section-tag">Get In Touch</p>
          <h1>Let's Talk <span class="text-gradient">Fitness</span></h1>
          <p class="section-lede">
            Send us a message and Coach Elena's team will respond within 24 hours.
          </p>
        </div>

        <div class="glass-card">
          <!-- No backend ships with the template: the handler in
               src/scripts/contact-form.js confirms locally. Point `action` at
               your own endpoint when wiring this up for real. -->
          <form id="pageContactForm">
            <div class="form-group">
              <label class="form-label" for="contactName">Your Name</label>
              <input type="text" id="contactName" name="name" class="form-input" placeholder="e.g. Jessica Alba" autocomplete="name" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactEmail">Email Address</label>
              <input type="email" id="contactEmail" name="email" class="form-input" placeholder="e.g. jessica@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactSubject">Subject</label>
              <input type="text" id="contactSubject" name="subject" class="form-input" placeholder="Coaching Inquiry / Template Customization" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="contactMessage">Message</label>
              <textarea id="contactMessage" name="message" class="form-textarea" rows="5" placeholder="Tell us about your fitness goals or questions..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p>&copy; 2026 FitSculpt Pro Template. All rights reserved.</p>
    </div>
  </footer>

  <script type="module" src="../src/scripts/main.js"></script>
</body>
</html>
